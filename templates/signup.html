<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — MINDAEYE</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-1" style="color: #0D6EFD;">MINDAEYE</h1>
        <p class="text-center text-gray-500 text-sm mb-6">Create your account</p>
        <form id="signup-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Full Name</label>
                <input type="text" id="name" required class="w-full border rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" required class="w-full border rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required minlength="8" class="w-full border rounded-lg px-3 py-2">
                <p class="text-xs text-gray-500 mt-1">Minimum 8 characters</p>
            </div>
            <button type="submit" class="w-full py-2 rounded-lg text-white font-medium" style="background: #0D6EFD;">Sign Up</button>
        </form>
        <p class="text-center text-sm mt-4">Already have an account? <a href="/login" style="color: #0D6EFD;">Log in</a></p>
        <p class="text-center text-sm mt-2"><a href="/" class="text-gray-500">← Back to home</a></p>
    </div>
    <script>
        document.getElementById('signup-form').addEventListener('submit', async e => {
            e.preventDefault();
            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                }),
            });
            const data = await res.json();
            if (data.success) {
                alert(data.message);
                window.location.href = '/login';
            } else {
                alert(data.message);
            }
        });
    </script>
</body>
</html>
