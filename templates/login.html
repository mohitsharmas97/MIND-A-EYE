<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MINDAEYE</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-1" style="color: #0D6EFD;">MINDAEYE</h1>
        <p class="text-center text-gray-500 text-sm mb-6">MIND + EYE medical imaging AI</p>
        <div id="message-container" class="mb-4 text-sm"></div>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" required class="w-full border rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required class="w-full border rounded-lg px-3 py-2">
            </div>
            <label class="flex items-center text-sm">
                <input type="checkbox" id="remember" class="mr-2"> Remember me
            </label>
            <button type="submit" class="w-full py-2 rounded-lg text-white font-medium" style="background: #0D6EFD;">Log In</button>
        </form>
        <p class="text-center text-sm mt-4">No account? <a href="/signup" style="color: #0D6EFD;">Sign up</a></p>
        <p class="text-center text-sm mt-2"><a href="/" class="text-gray-500">← Back to home</a></p>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async e => {
            e.preventDefault();
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    remember: document.getElementById('remember').checked,
                }),
            });
            const data = await res.json();
            const box = document.getElementById('message-container');
            if (data.success) {
                box.innerHTML = '<p class="text-green-600">' + data.message + '</p>';
                setTimeout(() => window.location.href = data.redirect || '/upload', 800);
            } else {
                box.innerHTML = '<p class="text-red-600">' + data.message + '</p>';
            }
        });
    </script>
</body>
</html>
